{% extends 'base.html' %}
{% block title %}Reset Password – Traveloop{% endblock %}
{% block content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a1a2e,#2d7dd2);">
  <div style="width:100%;max-width:420px;padding:1rem;">
    <div class="card">
      <div style="background:linear-gradient(135deg,#f5a623,#e0901a);padding:2rem;text-align:center;">
        <div style="font-size:3rem;margin-bottom:0.5rem;">🔑</div>
        <h1 style="color:white;font-size:1.8rem;font-weight:800;">Create New Password</h1>
        <p style="color:rgba(255,255,255,0.85);font-size:0.9rem;margin-top:0.25rem;">Choose a strong password</p>
      </div>
      <div class="card-body" style="padding:2rem;">
        
        {% if messages %}
          {% for message in messages %}
            <div style="padding:0.75rem;margin-bottom:1rem;border-radius:8px;background:{% if message.tags == 'error' %}#fee;color:#c33{% else %}#efe;color:#3c3{% endif %};">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}
        
        <form method="post">
          {% csrf_token %}
          <div class="form-group">
            <label>New Password</label>
            <input type="password" name="new_password" class="form-input" required minlength="6" placeholder="Minimum 6 characters">
          </div>
          <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" name="confirm_password" class="form-input" required minlength="6" placeholder="Re-enter password">
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:0.75rem;">
            Reset Password ✓
          </button>
        </form>
        
        <p style="text-align:center;margin-top:1.5rem;font-size:0.9rem;color:var(--muted);">
          <a href="{% url 'login' %}" style="color:var(--primary);font-weight:600;">Back to Login</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
